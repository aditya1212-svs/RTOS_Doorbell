spring.datasource.url=jdbc:h2:mem:doorbell-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
face-detection.enabled=false
face-detection.python-command=python3
face-detection.script-path=face-detector/face_detector.py
face-detection.working-directory=.
face-detection.max-image-bytes=5242880
face-detection.processing-threads=1
face-detection.interval-ms=0
face-detection.confidence-threshold=5
face-detection.startup-timeout-ms=100
face-detection.request-timeout-ms=100
face-recognition.enabled=false
face-recognition.threshold=0.6
face-recognition.request-timeout-ms=100
