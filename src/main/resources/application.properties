spring.application.name=RTOS_Doorbell
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.digest.cron=${APP_DIGEST_CRON:0 0 22 * * *}
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5173,http://localhost:5174}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/doorbell}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
face-detection.enabled=${FACE_DETECTION_ENABLED:true}
face-detection.python-command=${FACE_DETECTION_PYTHON_COMMAND:face-detector/.venv/bin/python}
face-detection.script-path=${FACE_DETECTION_SCRIPT_PATH:face-detector/face_detector.py}
face-detection.working-directory=${FACE_DETECTION_WORKING_DIRECTORY:.}
face-detection.max-image-bytes=${FACE_DETECTION_MAX_IMAGE_BYTES:5242880}
face-detection.processing-threads=${FACE_DETECTION_PROCESSING_THREADS:2}
face-detection.interval-ms=${FACE_DETECTION_INTERVAL_MS:200}
# Haar cascades use min-neighbors rather than a probability; higher values are stricter.
face-detection.confidence-threshold=${FACE_DETECTION_CONFIDENCE_THRESHOLD:5}
face-detection.startup-timeout-ms=${FACE_DETECTION_STARTUP_TIMEOUT_MS:10000}
face-detection.request-timeout-ms=${FACE_DETECTION_REQUEST_TIMEOUT_MS:5000}
face-recognition.enabled=${FACE_RECOGNITION_ENABLED:true}
# face_recognition uses a distance threshold; lower distance means a closer match.
face-recognition.threshold=${FACE_RECOGNITION_THRESHOLD:0.6}
face-recognition.request-timeout-ms=${FACE_RECOGNITION_REQUEST_TIMEOUT_MS:5000}
# Optional REST + topic gateway for device-scoped face endpoints / subscriptions.
# When enabled=true and an allowlist is configured, only allowed devices may call
# /api/face/detect|recognize|stored and subscribe to /topic/face/{deviceId}.
face.auth.enabled=${FACE_AUTH_ENABLED:false}
face.auth.allowed-devices=${FACE_AUTH_ALLOWED_DEVICES:}
